<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <h2>skeleton loader + setTimeout</h2>

    <div class="card" id="card">
      <div class="skeleton-wrapper">
        <div class="skeleton titulo"></div>
        <div class="skeleton linha"></div>
        <div class="skeleton linha"></div>
        <div class="skeleton linha"></div>
        <div class="skeleton imagem"></div>
      </div>

      <div class="conteudo">
        <h3>Página carregada</h3>
        <p>Teste de carregamento</p>
        <div class="foto"></div>
      </div>
    </div>

    <script>
      setTimeout(() => {
        document.getElementById("card").classList.add("carregado");
      }, 2500);
    </script>
  </body>
</html>
