<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      :root {
        --animate-duration: 0.8s;
      }

      h2 {
        font-size: 1rem;
        margin-top: 50px;
      }

      .card {
        width: 320px;
      }

      .skeleton {
        border-radius: 4px;
        background-color: #e0e0e0;
      }

      .skeleton.titulo {
        width: 60%;
        height: 20px;
        margin-bottom: 16px;
      }

      .skeleton.linha {
        width: 100%;
        height: 12px;
        margin-bottom: 10px;
      }

      .skeleton.linha:last-of-type {
        width: 80%;
      }

      .skeleton.imagem {
        width: 100%;
        height: 160px;
        margin-top: 16px;
      }

      .conteudo {
        display: none;
      }

      .conteudo .foto {
        width: 100%;
        height: 160px;
        border-radius: 4px;
        margin-top: 16px;
        background: linear-gradient(135deg, #8ecae6, #219ebc);
      }

      .carregado .skeleton-wrapper {
        display: none;
      }
    </style>
  </head>

  <body>
    <h2>animate__flash animate__infinite / animate__repeat-3 no skeleton</h2>
    <h2>animate__fadeOut no skeleton e animate__fadeInUp animate__delay-1s no conteúdo (JS)</h2>

    <div class="card" id="card">
      <div class="skeleton-wrapper">
        <div class="skeleton titulo animate__animated animate__flash animate__infinite"></div>
        <div class="skeleton linha animate__animated animate__flash animate__infinite"></div>
        <div class="skeleton linha animate__animated animate__flash animate__infinite"></div>
        <div class="skeleton linha animate__animated animate__flash animate__infinite"></div>
        <div class="skeleton imagem animate__animated animate__flash animate__repeat-3"></div>
      </div>

      <div class="conteudo">
        <h3>Página carregada</h3>
        <p>Teste de carregamento</p>
        <div class="foto"></div>
      </div>
    </div>

    <script>
      const card = document.getElementById("card");
      const skeleton = card.querySelector(".skeleton-wrapper");
      const conteudo = card.querySelector(".conteudo");

      setTimeout(() => {
        skeleton.classList.add("animate__animated", "animate__fadeOut");
        conteudo.style.display = "block";
        conteudo.classList.add("animate__animated", "animate__fadeInUp", "animate__delay-1s");
        setTimeout(() => card.classList.add("carregado"), 800);
      }, 2500);
    </script>
  </body>
</html>
