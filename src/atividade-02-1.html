<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      .loader {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 14px solid #1e1e1e;
        border-bottom-color: #9d9d43;
        border-left-color: #9d9d43;
        animation: girar 1s linear infinite;
      }

      @keyframes girar {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <h2>carregamento com duas cores</h2>
    <div class="loader"></div>
  </body>
</html>
