<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      .container {
        width: 300px;
        margin: 0 auto;
        text-align: center;
      }

      .input-group {
        margin-bottom: 30px;
      }

      label {
        display: block;
        color: #1e1e1e;
        opacity: 0;
        transform: scale(0.5) translateY(10px);
        transition:
          opacity 500ms ease,
          transform 500ms ease;
      }

      .input-group:focus-within label {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      input {
        width: 100%;
        padding: 5px 0;
        text-align: center;
        outline: 0;
        border: none;
        border-bottom: 1px solid #808080;
        transition: border-bottom 500ms ease;
      }

      input:focus {
        border-bottom: 3px solid #1e1e1e;
      }

      input::placeholder {
        color: #808080;
        opacity: 1;
        transition: opacity 300ms ease;
      }

      input:focus::placeholder {
        opacity: 0;
      }

      button {
        width: 100px;
        height: 40px;
        color: #1e1e1e;
        background-color: #9d9d9d;
        border: 0;
        cursor: pointer;
        transition:
          background-color 500ms ease,
          color 500ms ease,
          box-shadow 500ms ease;
      }

      button:hover {
        color: white;
        background-color: #1e1e1e;
        box-shadow: 0 0 20px 5px #808080;
      }

      button:active {
        transform: scale(0.95);
      }

      img {
        display: block;
        margin: 60px auto 0;
        border: 1px solid #808080;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="input-group">
        <label for="login">Username:</label>
        <input id="login" type="text" name="login" placeholder="Username" />
      </div>
      <div class="input-group">
        <label for="password">Password:</label>
        <input
          id="password"
          type="password"
          name="login"
          placeholder="Password"
        />
      </div>
      <div class="button-group">
        <button>Enter</button>
      </div>
    </div>

    <img
      src="./img/form-login.gif"
      alt="Animação de referência do formulário de login"
      width="385"
      height="255"
    />
  </body>
</html>
