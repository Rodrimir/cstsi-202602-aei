<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      .barra {
        width: 320px;
        height: 30px;
        border: 2px solid #1e1e1e;
      }

      .barra div {
        height: 100%;
        background-color: red;
        animation: carregar 2.5s linear infinite;
      }

      @keyframes carregar {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <h2>barra de carregamento</h2>
    <div class="barra"><div></div></div>
  </body>
</html>
