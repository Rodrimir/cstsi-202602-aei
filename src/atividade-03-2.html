<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      :root {
        --animate-duration: 0.6s;
      }

      h2 {
        font-size: 1rem;
        margin-top: 50px;
      }

      button {
        width: 120px;
        height: 40px;
        color: #1e1e1e;
        background-color: transparent;
        background-image: linear-gradient(
          to right,
          #1e1e1e 50%,
          transparent 50%
        );
        background-size: 200% 100%;
        background-position: right center;
        border: 2px solid #1e1e1e;
        cursor: pointer;
        transition:
          background-position 500ms ease,
          color 500ms ease;
      }

      button:hover {
        color: white;
        background-position: left center;
      }

      input {
        width: 150px;
        padding: 8px;
        outline: 0;
        border: 1px solid #808080;
        transition:
          width 500ms ease,
          border-color 500ms ease;
      }

      input:focus {
        width: 250px;
        border-color: #1e1e1e;
        animation-name: headShake;
        animation-duration: var(--animate-duration);
      }

      nav a {
        margin-right: 25px;
        color: #1e1e1e;
        text-decoration: none;
        animation-play-state: paused;
      }

      nav a:hover {
        animation-play-state: running;
      }

      .caixa {
        width: 100px;
        height: 100px;
        background-color: red;
        transition:
          border-radius 3s ease,
          background-image 3s ease;
      }

      .caixa:hover {
        border-radius: 50%;
        background-image: url(./img/e.jpg);
        background-size: cover;
      }
    </style>
  </head>

  <body>
    <h2>animate__jello no hover do botão (JS)</h2>
    <button id="btn">Enter</button>

    <h2>animation-name: headShake (direto do Animate.css) + var(--animate-duration) no foco</h2>
    <input type="text" placeholder="E-mail" />

    <h2>animate__flash animate__infinite pausada, roda no hover (animation-play-state)</h2>
    <nav>
      <a class="animate__animated animate__flash animate__infinite" href="#">Início</a>
      <a class="animate__animated animate__flash animate__infinite" href="#">Sobre</a>
      <a class="animate__animated animate__flash animate__infinite" href="#">Contato</a>
    </nav>

    <h2>animate__tada animate__infinite no hover da caixa (JS)</h2>
    <div class="caixa" id="caixa"></div>

    <script>
      const btn = document.getElementById("btn");
      btn.addEventListener("mouseover", () => {
        btn.classList.add("animate__animated", "animate__jello");
      });
      btn.addEventListener("mouseleave", () => {
        btn.classList.remove("animate__animated", "animate__jello");
      });

      const caixa = document.getElementById("caixa");
      caixa.addEventListener("mouseover", () => {
        caixa.classList.add("animate__animated", "animate__tada", "animate__infinite");
      });
      caixa.addEventListener("mouseleave", () => {
        caixa.classList.remove("animate__animated", "animate__tada", "animate__infinite");
      });
    </script>
  </body>
</html>
