<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      :root {
        --animate-duration: 0.6s;
      }

      h2 {
        font-size: 1rem;
        margin-top: 50px;
      }

      .container {
        width: 300px;
        margin: 0 auto;
        text-align: center;
      }

      .input-group {
        margin-bottom: 30px;
      }

      label {
        display: block;
        color: #1e1e1e;
        opacity: 0;
      }

      input {
        width: 100%;
        padding: 5px 0;
        text-align: center;
        outline: 0;
        border: none;
        border-bottom: 1px solid #808080;
      }

      input:focus {
        border-bottom: 3px solid #1e1e1e;
        animation-name: pulse;
        animation-duration: var(--animate-duration);
      }

      #password:focus {
        --animate-duration: 1.2s;
      }

      button {
        width: 120px;
        height: 40px;
        color: #1e1e1e;
        background-color: #9d9d9d;
        border: 0;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>animate__fadeInUp / animate__fadeOutDown no focus e blur (JS)</h2>
    <div class="container">
      <div class="input-group">
        <label for="login">Username:</label>
        <input id="login" type="text" name="login" placeholder="Username" />
      </div>
      <div class="input-group">
        <label for="password">Password:</label>
        <input
          id="password"
          type="password"
          name="login"
          placeholder="Password"
        />
      </div>
    </div>

    <h2>animation-name: pulse (direto do Animate.css) + var(--animate-duration) no foco</h2>

    <h2>animate__rubberBand animate__faster no hover do botão (JS)</h2>
    <div class="container">
      <div class="button-group">
        <button id="btn">Enter</button>
      </div>
    </div>

    <script>
      const login = document.getElementById("login");
      const loginLabel = document.querySelector('label[for="login"]');
      login.addEventListener("focus", () => {
        loginLabel.classList.remove("animate__fadeOutDown");
        loginLabel.classList.add("animate__animated", "animate__fadeInUp");
      });
      login.addEventListener("blur", () => {
        loginLabel.classList.remove("animate__fadeInUp");
        loginLabel.classList.add("animate__animated", "animate__fadeOutDown");
      });

      const password = document.getElementById("password");
      const passwordLabel = document.querySelector('label[for="password"]');
      password.addEventListener("focus", () => {
        passwordLabel.classList.remove("animate__fadeOutDown");
        passwordLabel.classList.add("animate__animated", "animate__fadeInUp");
      });
      password.addEventListener("blur", () => {
        passwordLabel.classList.remove("animate__fadeInUp");
        passwordLabel.classList.add("animate__animated", "animate__fadeOutDown");
      });

      const btn = document.getElementById("btn");
      btn.addEventListener("mouseover", () => {
        btn.classList.add("animate__animated", "animate__rubberBand", "animate__faster");
      });
      btn.addEventListener("mouseleave", () => {
        btn.classList.remove("animate__animated", "animate__rubberBand", "animate__faster");
      });
    </script>
  </body>
</html>
