<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --animate-brilho: brilho 1.2s linear infinite;

        @keyframes brilho {
          from {
            background-position: 200% 0;
          }
          to {
            background-position: -200% 0;
          }
        }
      }

      @utility brilho {
        background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
        background-size: 200% 100%;
        animation: var(--animate-brilho);
      }
    </style>
  </head>

  <body class="p-10 font-sans">
    <h2 class="text-2xl font-bold mb-6">Skeleton loader da aula 02 recriado com Tailwind (classe brilho + utilitárias)</h2>

    <div class="w-80">
      <div id="skeleton">
        <div class="brilho h-5 w-3/5 rounded mb-4"></div>
        <div class="brilho h-3 w-full rounded mb-2.5"></div>
        <div class="brilho h-3 w-full rounded mb-2.5"></div>
        <div class="brilho h-3 w-4/5 rounded"></div>
        <div class="brilho h-40 w-full rounded mt-4"></div>
      </div>

      <div id="conteudo" class="hidden">
        <h3 class="text-lg font-bold">Página carregada</h3>
        <p>Teste de carregamento</p>
        <div class="h-40 w-full rounded mt-4 bg-linear-to-br from-[#8ecae6] to-[#219ebc]"></div>
      </div>
    </div>

    <script>
      setTimeout(() => {
        document.getElementById("skeleton").classList.add("hidden");
        document.getElementById("conteudo").classList.remove("hidden");
      }, 2500);
    </script>
  </body>
</html>
